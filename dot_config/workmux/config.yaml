# workmux global configuration
# Reference: `workmux config reference` (all options, documented)
# Project overrides: .workmux.yaml in a repo root
# Layout adapted from https://github.com/smnatale/dotfiles/blob/main/dot_config/workmux/config.yaml

# each worktree opens as a separate session as opposed to windows
# per-command override: workmux add <branch> --mode window
mode: session

# don't add agent icons to tmux windows
status_format: false

# enable nerd fonts
nerdfont: true

window_prefix: "{project} 󰘬 "

windows:
  - name: agent
    panes:
      - command: pi
        focus: true
  - name: lazygit
    panes:
      - command: lazygit

# branch new worktrees from the detected main/master instead of the
# currently checked out branch
base_branch: auto

# keep the dashboard open after jumping to an agent/worktree with Enter,
# so `sesh last` back to the hub session lands on the dashboard again
dashboard:
  close_on_jump: false
