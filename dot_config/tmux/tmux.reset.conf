# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -vb -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind C-s choose-session
bind R source-file ~/.config/tmux/tmux.conf
bind K send-keys "clear"\; send-keys "Enter"

# Vim-style selections in copy-mode (the pane border tags them VISUAL /
# V-LINE / V-BLOCK). tmux keeps rectangle mode on after a selection ends, so
# v and V switch it off first. C-v starts a block selection like vim (tmux's
# default only toggles the rectangle shape), switches a running selection to
# block, or ends a block selection.
bind-key -T copy-mode-vi v send-keys -X rectangle-off \; send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-off \; send-keys -X select-line
bind-key -T copy-mode-vi C-v if -F '#{selection_active}' 'if -F "#{rectangle_toggle}" "send-keys -X clear-selection" "send-keys -X rectangle-on"' 'send-keys -X begin-selection ; send-keys -X rectangle-on'

# Vim-style half-page scrolling in copy-mode, centred like <C-u>zz / <C-d>zz
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down \; send-keys -X scroll-middle
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up \; send-keys -X scroll-middle

# Open new window in current directory with prefix+c
bind-key ^C new-window -c "#{pane_current_path}"

# Close current pane with prefix+C
bind-key c kill-pane

# Open split pane in current directory
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
