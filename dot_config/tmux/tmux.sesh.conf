# sesh-list.sh prints "<target>\t<display>": fzf shows/matches the short
# display (no ~/projects/ prefix) and hands sesh the real target.
SESH_LIST="~/.config/tmux/scripts/sesh-list.sh"
SESH_COMMAND="sesh connect \"$(
  $SESH_LIST | fzf-tmux -p 95%,85% \
    --delimiter '\t' --with-nth 2 --accept-nth 1 \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload($SESH_LIST)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload($SESH_LIST -t)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload($SESH_LIST -c)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload($SESH_LIST -z)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload($SESH_LIST --find)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {1})+change-prompt(⚡  )+reload($SESH_LIST)' \
    --preview-window 'right:45%' \
    --preview 'sesh preview {1}'
)\""

bind-key "/" run-shell "$SESH_COMMAND"
bind -N "last-session (via sesh) " l run-shell "sesh last"
bind -N "switch to root session (via sesh) " 9 run-shell "sesh connect --root \'$(pwd)\'"
