name: Create Tag and Release
on:
  pull_request:
    types: [closed]
    # Only repository changes need a release; workflow-only PRs do not.
    paths-ignore:
      - '.github/**'
jobs:
  create-tag-and-release:
    name: Create Tag and Release
    uses: lowranceworks/common-workflows/.github/workflows/create-tag-and-release.yaml@main
    permissions:
      contents: write
      pull-requests: read
      issues: read
